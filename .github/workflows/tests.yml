name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server-tests:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        # tests/setup.ts sets its own JWT_KEY/NODE_ENV/Mongo defaults and
        # spins up an in-memory MongoDB per file, so no secrets or services
        # need to be provided here.
        run: npm test

  client-tests:
    name: Client tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  e2e-tests:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    # Non-blocking while this suite is new and settling in: a flake here
    # is surfaced (the job still runs and reports real pass/fail below)
    # but never fails the whole workflow or the commit's checks, and
    # `deploy` below doesn't `need` this job — so it can't hold up or
    # break a real deploy. Once it's proven stable, drop
    # `continue-on-error` and add `e2e-tests` to deploy's `needs` list to
    # make it a real gate like the two jobs above.
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            e2e/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Verify Chrome is available
        # playwright.config.ts runs with channel: "chrome" — the real
        # Google Chrome, not Playwright's own downloaded Chromium — since
        # GitHub's ubuntu-latest runners ship it preinstalled. This skips
        # the Playwright browser download entirely (the same CDN download
        # that turned out to be unreliable on at least one dev machine —
        # see e2e/README.md). If a runner image ever stops shipping Chrome,
        # this step fails fast with a clear message instead of the less
        # obvious "channel not found" error Playwright itself would give.
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            echo "::error::google-chrome not found on this runner. Either the runner image changed, or fall back to 'npx playwright install --with-deps chromium' in e2e/ and drop channel: \"chrome\" from playwright.config.ts."
            exit 1
          fi
          google-chrome --version

      - name: Run Playwright tests
        working-directory: e2e
        # playwright.config.ts starts the real server (tests/e2e-server.ts,
        # in-memory MongoDB) and the real Vite dev client itself — nothing
        # extra needs to be running here.
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

  deploy:
    name: Deploy to Render + Vercel
    runs-on: ubuntu-latest
    needs: [server-tests, client-tests]
    # Only deploy on an actual push to main — never on pull requests, and
    # never if either test job above failed (needs: already enforces this,
    # but the explicit success() check makes the gating unmistakable).
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && success()

    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Trigger Vercel deploy
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
