name: Conversations API Contract Tests

# Guards the /api/conversations list + DELETE /api/conversations/:roomId
# endpoints described in claude_conventions.md, including the "Unknown user"
# fallback for participants who no longer exist.
#
# This workflow assumes a Node/Express-style backend with a seeded Postgres
# test DB. If the backend is Laravel/PHP instead, swap the "Setup Node" /
# "Install dependencies" / "Run tests" steps for setup-php + `php artisan test`,
# and point DATABASE_URL at the Laravel test connection.

on:
  pull_request:
    paths:
      - "server/**"
      - "api/**"

jobs:
  api-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: relay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://test:test@localhost:5432/relay_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run DB migrations
        run: npm run migrate

      - name: Seed test data (including an orphaned participant)
        run: npm run seed:test

      - name: Run API contract tests
        run: npm test -- tests/api/conversations.spec.ts

