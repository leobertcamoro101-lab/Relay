name: Visual Regression Tests

# Screenshots the Sidebar/off-canvas drawer and Direct Messages list at
# mobile, tablet, and desktop widths so behavior documented in
# claude_conventions.md (drawer below `md`, static at `md:`+, "Unknown user"
# fallback) doesn't silently regress.

on:
  pull_request:
    paths:
      - "client/src/pages/authenticated/**"
      - "client/src/Navigation/**"

jobs:
  visual-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Install Playwright browsers
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Build app
        working-directory: client
        run: npm run build

      - name: Run visual regression suite
        working-directory: client
        run: npx playwright test tests/visual/sidebar.spec.ts --reporter=github

      - name: Upload diff screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diffs
          path: client/test-results/
          retention-days: 14

